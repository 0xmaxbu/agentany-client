[package]
name = "agentany-shell"
version = "0.1.0"
description = "AgentAny 设备客户端（Tauri 壳：托盘/设置窗/授权弹窗 + host 侧车）"
edition = "2021"

[lib]
name = "agentany_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
